name: check

# dist/ is committed so the repo works as a plain download. That only stays
# true if every source edit is rebuilt, so the build runs in --check mode and
# fails on any file that would come out different.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/build.mjs --check

      # Emoji, gradient text and icons in headings in the demos, eval runs and
      # pack assets - the marks core/11-restraint.md forbids that a script can
      # see. Fails, because a demo carrying them is evidence against the packs.
      - run: node tools/restraint.mjs

      # Prints where a pack restates a core rule instead of pointing at it.
      # Always exits 0: the check is lexical and the rule is semantic, so the
      # output is for a reviewer to read, not for CI to judge.
      - run: node tools/dupcheck.mjs
